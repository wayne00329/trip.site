<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅｜香港跨年散策</title>
  <style>
    :root {
      --neon: #38bdf8;
      --bg: linear-gradient(145deg, #071324, #0f253c, #162238);
      --card: rgba(15, 30, 52, 0.94);
      --border: rgba(255, 255, 255, 0.15);
      --text: #f1f5f9;
      --sub: #94a3b8;
      --pill: rgba(255, 255, 255, 0.08);
    }

    body.light {
      --bg: linear-gradient(145deg, #e0f2fe, #f0f9ff, #fefce8);
      --card: rgba(255, 255, 255, 0.96);
      --border: rgba(14, 116, 144, 0.2);
      --text: #0f172a;
      --sub: #475569;
      --pill: rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding-bottom: 40px;
      color: var(--text);
      background: var(--bg);
      background-attachment: fixed;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif;
      line-height: 1.5;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--pill);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      transition: color 0.12s, border-color 0.12s, box-shadow 0.12s;
    }

    button:hover,
    button.active {
      border-color: var(--neon);
      box-shadow: 0 0 10px var(--neon);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
    }

    body.glass header,
    body.glass .card,
    body.glass .modal-box {
      background: color-mix(in srgb, var(--card) 68%, transparent);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .wrap {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .nav {
      max-width: 800px;
      margin: 8px auto 0;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .nav a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.82rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--pill);
      white-space: nowrap;
    }

    main {
      max-width: 800px;
      margin: 16px auto;
      padding: 0 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.3rem;
      text-shadow: 0 0 10px var(--neon);
    }

    h2 {
      font-size: 1.1rem;
      margin: 0 0 10px;
    }

    .badge {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 1px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--neon);
      color: var(--neon);
      margin-bottom: 6px;
    }

    .cd {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .cd-box {
      background: var(--pill);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      text-align: center;
    }

    .cd-n {
      display: block;
      color: var(--neon);
      font-size: 1.5rem;
      font-weight: 800;
    }

    .cd-l {
      color: var(--sub);
      font-size: 0.75rem;
    }

    .item {
      background: var(--pill);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .time {
      min-width: 50px;
      color: var(--neon);
      font-weight: 700;
      font-size: 0.88rem;
    }

    .muted {
      color: var(--sub);
      font-size: 0.82rem;
    }

    .edit-actions {
      display: none;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    body.editing .edit-actions {
      display: flex;
    }

    .edit-only {
      display: none;
    }

    body.editing .edit-only {
      display: inline-flex;
    }

    .edit-bar {
      display: none;
      background: rgba(56, 189, 248, 0.15);
      border: 1px dashed var(--neon);
      border-radius: 12px;
      padding: 8px 12px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(5, 12, 24, 0.7);
      backdrop-filter: blur(8px);
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 420px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      border: 1px solid var(--neon);
      border-radius: 20px;
      background: var(--card);
    }

    .toast {
      position: fixed;
      z-index: 200;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 16px;
      border: 1px solid var(--neon);
      border-radius: 999px;
      background: #0f172a;
      color: #fff;
      font-size: 0.82rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .toast.show {
      opacity: 1;
    }

    @media (max-width: 480px) {
      .card {
        padding: 15px;
      }

      header .wrap {
        align-items: flex-start;
      }

      .btns button {
        padding: 6px 9px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div style="font-weight:800;font-size:1rem">🇭🇰 港 26-27 跨年旅記</div>
      <div class="btns">
        <button onclick="mOpen('styleModal')">🎨 風格</button>
        <button id="eBtn" onclick="toggleEdit()">✏️ 編輯</button>
      </div>
    </div>

    <nav class="nav">
      <a href="#sec-ov">總覽</a>
      <a href="#sec-fl">航班</a>
      <a href="#sec-it">行程</a>
      <a href="#sec-ho">住宿</a>
      <a href="#sec-ck">清單</a>
    </nav>
  </header>

  <main>
    <div id="eBar" class="edit-bar">
      <span>🛠️ 編輯模式開啟中</span>
      <div class="btns">
        <button onclick="expK()">匯出備份</button>
        <button onclick="impK()">匯入備份</button>
        <button onclick="rstK()">還原預設</button>
      </div>
    </div>

    <section id="sec-ov" class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span class="badge">HONG KONG TRIP</span>
        <button class="edit-only" onclick="editOverview()">✏️ 編輯總覽</button>
      </div>
      <h1 id="oT"></h1>
      <div id="oR" class="muted" style="font-size:.9rem"></div>
      <div id="oD" class="muted" style="margin-top:2px"></div>
      <div class="muted" style="margin-top:12px;font-size:.85rem">⏳ 距離起飛還有</div>
      <div class="cd">
        <div class="cd-box"><span id="cd1" class="cd-n">--</span><span class="cd-l">天</span></div>
        <div class="cd-box"><span id="cd2" class="cd-n">--</span><span class="cd-l">時</span></div>
        <div class="cd-box"><span id="cd3" class="cd-n">--</span><span class="cd-l">分</span></div>
        <div class="cd-box"><span id="cd4" class="cd-n">--</span><span class="cd-l">秒</span></div>
      </div>
    </section>

    <section id="sec-fl" class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <h2>✈️ 航班資訊</h2>
        <button class="edit-only" onclick="addFlight()">＋ 新增航班</button>
      </div>
      <div id="fList"></div>
    </section>

    <section id="sec-it" class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <h2>🗺️ 每日散策行程</h2>
        <button class="edit-only" onclick="addDay()">＋ 新增日期</button>
      </div>
      <div class="muted">點擊日期切換行程</div>
      <div id="dTabs" style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0"></div>
      <div id="sList"></div>
      <button class="edit-only" style="width:100%;justify-content:center;margin-top:4px" onclick="addSpot()">＋ 新增景點</button>
    </section>

    <section id="sec-ho" class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <h2>🏨 住宿資訊</h2>
        <button class="edit-only" onclick="editHotel()">✏️ 編輯住宿</button>
      </div>
      <div id="hBox" style="margin-top:10px"></div>
    </section>

    <section id="sec-ck" class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <h2>✅ 行前清單</h2>
        <div class="btns">
          <button onclick="rstCk()">重設勾選</button>
          <button class="edit-only" onclick="addCheck()">＋ 新增項目</button>
        </div>
      </div>
      <div id="cList" style="margin-top:10px"></div>
    </section>

    <footer style="text-align:center;color:var(--sub);font-size:.8rem;padding:10px 0">
      🇭🇰 Happy New Year 2027 🎉
    </footer>
  </main>

  <div id="styleModal" class="modal" onclick="if(event.target===this)mClose('styleModal')">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:12px;font-weight:700">
        <span>🎨 風格設定</span>
        <button onclick="mClose('styleModal')">✕</button>
      </div>

      <div class="item" style="align-items:center">
        <span>🌓 深色 / 淺色模式</span>
        <button onclick="togTh()">切換</button>
      </div>

      <div class="item" style="align-items:center">
        <span>🪟 毛玻璃效果</span>
        <button id="glassBtn" onclick="togGlass()">開啟 / 關閉</button>
      </div>

      <div class="item" style="display:block">
        <div style="margin-bottom:8px">🌈 霓虹顏色</div>
        <div class="btns">
          <button onclick="setCol('#38bdf8')" style="background:#38bdf8">藍</button>
          <button onclick="setCol('#2dd4bf')" style="background:#2dd4bf">青</button>
          <button onclick="setCol('#a78bfa')" style="background:#a78bfa">紫</button>
          <button onclick="setCol('#f472b6')" style="background:#f472b6">粉</button>
          <button onclick="setCol('#fb923c')" style="background:#fb923c">橘</button>
          <button onclick="setCol('#facc15')" style="background:#facc15">黃</button>
          <button onclick="togRb()">✨ 快速七彩流光</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">已儲存</div>

  <script>
    const defData = {
      o: {
        t: '香港跨年美食散策 2026-2027',
        r: '✈️ 高雄 KHH ➔ 香港 HKG',
        d: '📅 2026.12.30 - 2027.01.02',
        to: '2026-12-30T08:30:00+08:00'
      },
      f: [
        { t: '去程 12/30', r: '高雄 08:30 ➔ 香港 10:15', n: '建議提前2小時抵達' },
        { t: '回程 01/02', r: '香港 19:20 ➔ 高雄 20:55', n: '市區預辦登機' }
      ],
      ds: [
        { l: 'Day 1 · 12/30', s: [
          { ti: '11:30', t: '飯店寄放 & 華嫂冰室', n: '招牌菠蘿油' },
          { ti: '14:30', t: '西九文化區海濱長廊', n: '吹海風看維港' },
          { ti: '18:30', t: '廟街夜市 & 興記煲仔飯', n: '炭火臘味煲仔飯' }
        ]},
        { l: 'Day 2 · 12/31', s: [
          { ti: '10:00', t: '中環大館 & 嘉咸街', n: '文創咖啡' },
          { ti: '15:00', t: '天星小輪橫渡維港', n: '尖沙咀海旁' },
          { ti: '21:00', t: '維港跨年倒數煙火 🎉', n: '迎接 2027' }
        ]},
        { l: 'Day 3 · 01/01', s: [
          { ti: '10:30', t: '元旦早茶：一點心', n: '蝦餃燒賣' },
          { ti: '15:30', t: '太平山頂纜車 & 凌霄閣', n: '百萬夜景' }
        ]},
        { l: 'Day 4 · 01/02', s: [
          { ti: '10:00', t: '上環文武廟 & 伴手禮', n: '珍妮曲奇' }
        ]}
      ],
      h: {
        n: '尖沙咀 維港海景酒店',
        a: '香港九龍尖沙咀彌敦道',
        cn: '近港鐵站步行3分鐘'
      },
      c: [
        { t: '護照 + 港簽', d: false },
        { t: '八達通卡', d: false },
        { t: '英規三腳轉接頭', d: false },
        { t: '薄長袖 + 防風外套', d: false }
      ]
    };

    function clone(obj) {
      return JSON.parse(JSON.stringify(obj));
    }

    function readJSON(key, fallback) {
      try {
        const value = JSON.parse(localStorage.getItem(key));
        return value || fallback;
      } catch {
        return fallback;
      }
    }

    let st = readJSON('hk27_trip', clone(defData));
    let theme = readJSON('hk27_theme', {
      light: false,
      glass: false,
      rainbow: false,
      neon: '#38bdf8'
    });
    let cdx = 0;
    let rainbowHue = 195;

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[ch]);
    }

    function sv(message = '已自動儲存') {
      try {
        localStorage.setItem('hk27_trip', JSON.stringify(st));
        localStorage.setItem('hk27_theme', JSON.stringify(theme));
      } catch {
        stt('儲存失敗，請檢查瀏覽器儲存空間');
        return;
      }
      stt(message);
    }

    function stt(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1600);
    }

    function ask(label, current = '') {
      return prompt(label, current);
    }

    function render() {
      if (!st.ds.length) {
        st.ds.push({ l: '新的一天', s: [] });
        cdx = 0;
      }

      cdx = Math.max(0, Math.min(cdx, st.ds.length - 1));

      document.getElementById('oT').textContent = st.o.t;
      document.getElementById('oR').textContent = st.o.r;
      document.getElementById('oD').textContent = st.o.d;

      document.getElementById('fList').innerHTML = st.f.map((item, i) => `
        <div class="item">
          <div class="time">${esc(item.t)}</div>
          <div style="flex:1">
            <b>${esc(item.r)}</b>
            <div class="muted">${esc(item.n)}</div>
          </div>
          <div class="edit-actions">
            <button onclick="editFlight(${i})">修改</button>
            <button onclick="deleteFlight(${i})">刪除</button>
          </div>
        </div>
      `).join('') || '<div class="muted">尚未新增航班。</div>';

      document.getElementById('dTabs').innerHTML = st.ds.map((day, i) => `
        <button class="${i === cdx ? 'active' : ''}" onclick="selectDay(${i})">${esc(day.l)}</button>
      `).join('');

      const day = st.ds[cdx];
      const dayActions = `
        <div class="edit-actions">
          <button onclick="editDay(${cdx})">修改日期</button>
          <button onclick="deleteDay(${cdx})">刪除日期</button>
        </div>
      `;

      document.getElementById('sList').innerHTML =
        `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <b>${esc(day.l)}</b>${dayActions}
        </div>` +
        (day.s.map((spot, i) => `
          <div class="item">
            <div class="time">${esc(spot.ti)}</div>
            <div style="flex:1">
              <b>${esc(spot.t)}</b>
              <div class="muted">${esc(spot.n)}</div>
            </div>
            <div class="edit-actions">
              <button onclick="editSpot(${i})">修改</button>
              <button onclick="deleteSpot(${i})">刪除</button>
            </div>
          </div>
        `).join('') || '<div class="muted">這一天還沒有景點。</div>');

      document.getElementById('hBox').innerHTML = `
        <div class="item">
          <div style="flex:1">
            <b>${esc(st.h.n)}</b>
            <div class="muted">📍 ${esc(st.h.a)}<br>${esc(st.h.cn)}</div>
          </div>
        </div>
      `;

      document.getElementById('cList').innerHTML = st.c.map((item, i) => `
        <div class="item" style="align-items:center">
          <input type="checkbox" ${item.d ? 'checked' : ''}
            onchange="togCk(${i})"
            style="width:18px;height:18px;accent-color:var(--neon)">
          <span style="flex:1;${item.d ? 'text-decoration:line-through;opacity:.5' : ''}">
            ${esc(item.t)}
          </span>
          <div class="edit-actions">
            <button onclick="editCheck(${i})">修改</button>
            <button onclick="deleteCheck(${i})">刪除</button>
          </div>
        </div>
      `).join('') || '<div class="muted">尚未新增清單項目。</div>';

      updateTheme();
    }

    function updateCountdown() {
      const target = new Date(st.o.to).getTime();
      const diff = target - Date.now();
      const values = diff <= 0
        ? ['00', '00', '00', '00']
        : [
            String(Math.floor(diff / 86400000)).padStart(2, '0'),
            String(Math.floor(diff % 86400000 / 3600000)).padStart(2, '0'),
            String(Math.floor(diff % 3600000 / 60000)).padStart(2, '0'),
            String(Math.floor(diff % 60000 / 1000)).padStart(2, '0')
          ];

      ['cd1', 'cd2', 'cd3', 'cd4'].forEach((id, i) => {
        document.getElementById(id).textContent = values[i];
      });
    }

    function toggleEdit() {
      document.body.classList.toggle('editing');
      const editing = document.body.classList.contains('editing');
      document.getElementById('eBtn').textContent = editing ? '✅ 完成' : '✏️ 編輯';
      document.getElementById('eBar').style.display = editing ? 'flex' : 'none';
    }

    function editOverview() {
      const title = ask('修改旅程標題：', st.o.t);
      if (title === null) return;
      const route = ask('修改航線文字：', st.o.r);
      if (route === null) return;
      const dates = ask('修改旅遊日期文字：', st.o.d);
      if (dates === null) return;
      const departure = ask('修改起飛時間（例：2026-12-30T08:30:00+08:00）：', st.o.to);
      if (departure === null) return;

      st.o = { t: title, r: route, d: dates, to: departure };
      sv();
      render();
    }

    function addFlight() {
      const time = ask('航班標籤／日期（例：去程 12/30）：');
      if (time === null) return;
      const route = ask('航班路線（例：高雄 08:30 ➔ 香港 10:15）：');
      if (route === null) return;
      const note = ask('備註：', '');
      if (note === null) return;

      st.f.push({ t: time, r: route, n: note });
      sv();
      render();
    }

    function editFlight(i) {
      const item = st.f[i];
      const time = ask('修改航班標籤／日期：', item.t);
      if (time === null) return;
      const route = ask('修改航班路線：', item.r);
      if (route === null) return;
      const note = ask('修改備註：', item.n);
      if (note === null) return;

      st.f[i] = { t: time, r: route, n: note };
      sv();
      render();
    }

    function deleteFlight(i) {
      if (!confirm('確定刪除這個航班嗎？')) return;
      st.f.splice(i, 1);
      sv();
      render();
    }

    function selectDay(i) {
      cdx = i;
      render();
    }

    function addDay() {
      const label = ask('輸入日期名稱（例：Day 5 · 01/03）：');
      if (label === null || !label.trim()) return;
      st.ds.push({ l: label, s: [] });
      cdx = st.ds.length - 1;
      sv();
      render();
    }

    function editDay(i) {
      const label = ask('修改日期名稱：', st.ds[i].l);
      if (label === null) return;
      st.ds[i].l = label;
      sv();
      render();
    }

    function deleteDay(i) {
      if (st.ds.length <= 1) {
        alert('至少保留一天行程。');
        return;
      }
      if (!confirm('確定刪除此日期及其所有景點嗎？')) return;
      st.ds.splice(i, 1);
      cdx = Math.min(cdx, st.ds.length - 1);
      sv();
      render();
    }

    function addSpot() {
      const time = ask('景點時間（例：12:00）：');
      if (time === null) return;
      const title = ask('景點名稱：');
      if (title === null) return;
      const note = ask('備註：', '');
      if (note === null) return;

      st.ds[cdx].s.push({ ti: time, t: title, n: note });
      sv();
      render();
    }

    function editSpot(i) {
      const spot = st.ds[cdx].s[i];
      const time = ask('修改景點時間：', spot.ti);
      if (time === null) return;
      const title = ask('修改景點名稱：', spot.t);
      if (title === null) return;
      const note = ask('修改備註：', spot.n);
      if (note === null) return;

      st.ds[cdx].s[i] = { ti: time, t: title, n: note };
      sv();
      render();
    }

    function deleteSpot(i) {
      if (!confirm('確定刪除這個景點嗎？')) return;
      st.ds[cdx].s.splice(i, 1);
      sv();
      render();
    }

    function editHotel() {
      const name = ask('修改住宿名稱：', st.h.n);
      if (name === null) return;
      const address = ask('修改住宿地址：', st.h.a);
      if (address === null) return;
      const note = ask('修改住宿備註：', st.h.cn);
      if (note === null) return;

      st.h = { n: name, a: address, cn: note };
      sv();
      render();
    }

    function addCheck() {
      const title = ask('新增行前清單項目：');
      if (title === null || !title.trim()) return;
      st.c.push({ t: title, d: false });
      sv();
      render();
    }

    function editCheck(i) {
      const title = ask('修改清單項目：', st.c[i].t);
      if (title === null) return;
      st.c[i].t = title;
      sv();
      render();
    }

    function deleteCheck(i) {
      if (!confirm('確定刪除這個清單項目嗎？')) return;
      st.c.splice(i, 1);
      sv();
      render();
    }

    function togCk(i) {
      st.c[i].d = !st.c[i].d;
      sv();
      render();
    }

    function rstCk() {
      st.c.forEach(item => item.d = false);
      sv('已重設清單勾選');
      render();
    }

    function expK() {
      const backup = JSON.stringify(st, null, 2);
      prompt('請複製以下備份內容並妥善保存：', backup);
    }

    function impK() {
      const raw = prompt('請貼上之前匯出的備份內容：');
      if (!raw) return;

      try {
        const data = JSON.parse(raw);
        if (!data.o || !Array.isArray(data.f) || !Array.isArray(data.ds) ||
            !data.h || !Array.isArray(data.c)) {
          throw new Error('資料格式不符');
        }
        st = data;
        cdx = 0;
        sv('備份匯入成功');
        render();
      } catch {
        alert('匯入失敗：備份內容格式不正確。');
      }
    }

    function rstK() {
      if (!confirm('確定還原成原始預設行程嗎？目前的資料會被取代。')) return;
      st = clone(defData);
      cdx = 0;
      sv('已還原預設行程');
      render();
    }

    function mOpen(id) {
      document.getElementById(id).classList.add('open');
    }

    function mClose(id) {
      document.getElementById(id).classList.remove('open');
    }

    function updateTheme() {
      document.body.classList.toggle('light', !!theme.light);
      document.body.classList.toggle('glass', !!theme.glass);
      document.body.classList.toggle('rainbow', !!theme.rainbow);
      document.documentElement.style.setProperty('--neon', theme.neon || '#38bdf8');

      const glassButton = document.getElementById('glassBtn');
      if (glassButton) {
        glassButton.textContent = theme.glass ? '已開啟 ✓' : '目前關閉';
      }
    }

    function togTh() {
      theme.light = !theme.light;
      sv('已切換明暗模式');
      updateTheme();
    }

    function togGlass() {
      theme.glass = !theme.glass;
      sv(theme.glass ? '毛玻璃效果已開啟' : '毛玻璃效果已關閉');
      updateTheme();
    }

    function setCol(color) {
      theme.neon = color;
      theme.rainbow = false;
      sv('已更換霓虹顏色');
      updateTheme();
    }

    function togRb() {
      theme.rainbow = !theme.rainbow;
      if (theme.rainbow) rainbowHue = 195;
      sv(theme.rainbow ? '快速七彩流光已開啟' : '七彩流光已關閉');
      updateTheme();
    }

    // 每 45 毫秒變換色相，讓霓虹色連續快速循環。
    setInterval(() => {
      if (!theme.rainbow) return;
      rainbowHue = (rainbowHue + 5) % 360;
      document.documentElement.style.setProperty(
        '--neon',
        `hsl(${rainbowHue} 95% 65%)`
      );
    }, 45);

    render();
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
